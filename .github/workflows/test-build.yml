name: Test Build

# Runs on every push to main, plus on demand — no tag push, no public
# GitHub Release. This exists so Windows/Linux testers (neither OS the
# maintainer runs herself) can download a real prebuilt binary from this
# run's Actions page and try it, before an actual versioned release is
# cut.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Same windowing headers the build job needs, plus mesa-vulkan-drivers
      # for its Lavapipe software Vulkan ICD — GitHub's ubuntu-latest
      # runners have no real GPU, and every test that touches the GPU
      # (`mc_gpu::Context::new_headless`, which is most of the test suite)
      # needs *some* Vulkan adapter to request, even a software one.
      # libfontconfig1-dev is for font-kit's own Linux backend (Type node's
      # font search, mc_nodes::type_text) — its yeslogic-fontconfig-sys
      # build script pkg-config-looks-up fontconfig at compile time.
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcursor-dev libxi-dev libwayland-dev mesa-vulkan-drivers libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
        env:
          MC_GOLDEN_FAILURE_DIR: ${{ runner.temp }}/golden-failures

      # Only runs if a golden-image test actually failed above — lets a
      # cross-platform mismatch be downloaded and looked at directly,
      # instead of guessing at a tolerance number blind.
      - name: Upload golden-image failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.os }}
          path: ${{ runner.temp }}/golden-failures
          if-no-files-found: ignore
          retention-days: 7

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: MaterialCreator-windows
            binary_path: target/release/mc_app.exe
            nav_file: NAVIGATION-Windows.md
          - os: ubuntu-latest
            artifact_name: MaterialCreator-linux
            binary_path: target/release/mc_app
            nav_file: NAVIGATION-Linux.md
          - os: macos-latest
            artifact_name: MaterialCreator-macos
            binary_path: target/release/mc_app
            nav_file: NAVIGATION-macOS.md

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # README.md's own Linux build prerequisites (windowing dev headers —
      # wgpu loads the Vulkan driver itself at runtime, so no Vulkan SDK
      # needed here, just what's needed to compile against X11/Wayland).
      # libfontconfig1-dev is for font-kit's own Linux backend (Type node's
      # font search, mc_nodes::type_text) — its yeslogic-fontconfig-sys
      # build script pkg-config-looks-up fontconfig at compile time.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcursor-dev libxi-dev libwayland-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p mc_app

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item ${{ matrix.binary_path }} staging/MaterialCreator.exe
          Copy-Item ${{ matrix.nav_file }} staging/NAVIGATION.md
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir staging
          cp ${{ matrix.binary_path }} staging/MaterialCreator
          cp ${{ matrix.nav_file }} staging/NAVIGATION.md
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C staging MaterialCreator NAVIGATION.md

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          retention-days: 14

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz
          retention-days: 14
